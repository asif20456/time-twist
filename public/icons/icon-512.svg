<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="#090d16" opacity="0.85" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#3b82f6" stroke-width="12" opacity="0.6"/>
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="140" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="340" y2="256" stroke="#3b82f6" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="180" y2="330" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="16" fill="#ef4444"/>
</svg>
